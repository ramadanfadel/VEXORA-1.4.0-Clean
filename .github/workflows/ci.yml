name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: node --check src/app.js
      - run: npm run test:ui
      - run: npm audit --audit-level=high
      - run: npm pkg get version

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo audit --deny warnings

      - name: Version consistency
        shell: pwsh
        run: |
          $rust = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $json = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm  = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($rust -ne $json -or $rust -ne $npm) {
            throw "Version mismatch: cargo=$rust tauri=$json npm=$npm"
          }

      - name: Verify no secrets are committed
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -File -Force | Where-Object {
            $_.Extension -in @('.pfx','.p12','.pem','.key','.snk') -and $_.FullName -notmatch '\\target\\|\\node_modules\\'
          }
          if ($bad) { $bad | ForEach-Object { Write-Error "Secret-like file: $($_.FullName)" } }
