<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>VEXORA Smart Floating Bubble</title>
  <style>
    :root {
      --bg: #070c16;
      --card: #0d1829;
      --card2: #111f35;
      --line: #1e3452;
      --cyan: #22d3ee;
      --cyan2: #0891b2;
      --text: #e8f1fb;
      --muted: #8fa6c0;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: "Segoe UI", Tahoma, sans-serif; color: var(--text); user-select: none; }
    #app {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(17,31,53,.97), rgba(7,12,22,.97));
      border: 1px solid rgba(34,211,238,.28);
      box-shadow: 0 8px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
      opacity: var(--op, .96);
      transition: opacity .2s, box-shadow .2s;
    }
    #app:hover { box-shadow: 0 10px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(34,211,238,.4); }
    #handle { height: 19px; flex: 0 0 19px; display: flex; align-items: center;
      padding: 0 9px; cursor: grab; }
    #handle:active { cursor: grabbing; }
    #grip { width: 30px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.28); }
    #dots { margin-inline-start: auto; width: 18px; height: 16px; border: 0; border-radius: 6px;
      background: transparent; color: var(--muted); font-size: 13px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #dots:hover { background: rgba(34,211,238,.14); color: var(--cyan); }
    #main { flex: 1; display: flex; align-items: center; gap: 7px; padding: 0 10px 6px; overflow: hidden; }
    .brand { font-weight: 900; font-size: 13px; letter-spacing: .06em; color: var(--cyan);
      white-space: nowrap; padding-inline-end: 4px; border-inline-end: 1px solid var(--line); flex: 0 0 auto; }
    .metric { display: flex; flex-direction: column; gap: 3px; width: 52px; flex: 0 1 52px; min-width: 42px; }
    .metric .lab { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); }
    .metric .lab b { color: var(--text); font-variant-numeric: tabular-nums; }
    .bar { height: 3px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0%; border-radius: 3px;
      background: linear-gradient(90deg, var(--cyan2), var(--cyan)); transition: width .4s ease; }
    .net { direction: ltr; font-size: 10px; line-height: 1.45; font-variant-numeric: tabular-nums;
      color: var(--muted); white-space: nowrap; flex: 0 1 auto; overflow: hidden; }
    .net b { color: var(--text); font-weight: 600; }
    .net .up { color: #4ade80; }
    .net .down { color: #38bdf8; }
    .acts { margin-inline-start: auto; display: flex; gap: 5px; flex: 0 0 auto; }
    .act { width: 29px; height: 29px; border-radius: 9px; border: 1px solid var(--line);
      background: rgba(34,211,238,.07); color: var(--cyan); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: .15s; }
    .act:hover { background: rgba(34,211,238,.2); transform: translateY(-1px); }
    .act svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; }
    #menu {
      position: absolute; top: 22px; inset-inline-end: 6px; width: 262px; max-height: 330px;
      overflow-y: auto; background: #0a1424; border: 1px solid var(--line); border-radius: 14px;
      padding: 10px; box-shadow: 0 14px 34px rgba(0,0,0,.6); display: none;
      flex-direction: column; gap: 7px; z-index: 20; cursor: default;
    }
    #menu.show { display: flex; }
    #menu .title { font-size: 11px; font-weight: 700; color: var(--cyan); margin-bottom: 2px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; }
    .row label { color: var(--muted); }
    .sw { width: 30px; height: 16px; border-radius: 10px; background: #24344a; position: relative;
      cursor: pointer; flex: 0 0 30px; transition: .2s; }
    .sw::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px;
      width: 12px; height: 12px; border-radius: 50%; background: #9fb2c8; transition: .2s; }
    .sw.on { background: var(--cyan2); }
    .sw.on::after { inset-inline-start: 16px; background: #fff; }
    .row input[type=range] { width: 112px; accent-color: var(--cyan); }
    .row select { background: var(--card2); color: var(--text); border: 1px solid var(--line);
      border-radius: 7px; padding: 3px 5px; font-size: 10px; }
    .mbtn { border: 1px solid var(--line); background: rgba(34,211,238,.07); color: var(--text);
      border-radius: 8px; padding: 6px 8px; font-size: 10px; cursor: pointer; text-align: start; }
    .mbtn:hover { background: rgba(34,211,238,.16); color: var(--cyan); }
    .mbtn.warn { color: var(--danger); }
    /* Collapsed edge tab */
    body.collapsed #main { display: none; }
    body.collapsed #app { border-radius: 12px; }
    body.collapsed #handle { height: 100%; flex: 1; writing-mode: vertical-rl;
      justify-content: center; padding: 8px 0; }
    body.collapsed #grip { width: 3px; height: 28px; }
    body.collapsed #dots { display: none; }
    body.collapsed #tabLabel { display: block; }
    #tabLabel { display: none; writing-mode: vertical-rl; font-size: 10px; font-weight: 800;
      letter-spacing: .18em; color: var(--cyan); margin-block-start: 8px; }
    #toast {
      position: absolute; inset-inline: 10px; bottom: 8px; z-index: 40;
      background: rgba(10,20,36,.96); border: 1px solid var(--line); border-radius: 10px;
      color: var(--text); font-size: 11px; line-height: 1.5; padding: 8px 10px;
      text-align: center; pointer-events: none; opacity: 0; transform: translateY(6px);
      transition: opacity .18s, transform .18s;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.err { border-color: var(--danger); color: #fecaca; }
  </style>
</head>
<body>
  <div id="app">
    <div id="handle" title="اسحب للتحريك">
      <div id="grip"></div>
      <span id="tabLabel">VEXORA</span>
      <button id="dots" title="الإعدادات">&#8943;</button>
    </div>
    <div id="main">
      <div class="brand">VEXORA</div>
      <div class="metric">
        <div class="lab"><span>RAM</span><b id="ramTxt">—</b></div>
        <div class="bar"><i id="ramBar"></i></div>
      </div>
      <div class="metric">
        <div class="lab"><span>CPU</span><b id="cpuTxt">—</b></div>
        <div class="bar"><i id="cpuBar"></i></div>
      </div>
      <div class="net">
        <div class="up">&#9650; <b id="upTxt">0 B/s</b></div>
        <div class="down">&#9660; <b id="downTxt">0 B/s</b></div>
      </div>
      <div class="acts">
        <button class="act" id="btnClean" title="تنظيف">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
        </button>
        <button class="act" id="btnBoost" title="تسريع">
          <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
        </button>
        <button class="act" id="btnProc" title="برامج الخلفية">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>
        </button>
      </div>
    </div>
    <div id="menu">
      <div class="title">VEXORA Smart Floating Bubble</div>
      <div class="row"><label>إخفاء تلقائي على الحافة</label><div class="sw" id="swAutoHide"></div></div>
      <div class="row"><label>دائمًا في المقدمة</label><div class="sw" id="swTop"></div></div>
      <div class="row"><label>التصاق بالحواف</label><div class="sw" id="swSnap"></div></div>
      <div class="row"><label>تشغيل مع Windows</label><div class="sw" id="swRunWin"></div></div>
      <div class="row"><label>الشفافية</label><input type="range" id="rgOpacity" min="40" max="100" /></div>
      <div class="row"><label>الحجم</label><input type="range" id="rgScale" min="80" max="150" /></div>
      <div class="row"><label>تحديث البيانات ( ms )</label>
        <select id="selRefresh"><option value="1000">1000</option><option value="1500">1500</option>
          <option value="2000">2000</option><option value="3000">3000</option></select></div>
      <div class="row"><label>مسافة الالتصاق</label><input type="range" id="rgSnapDist" min="8" max="80" /></div>
      <div class="row"><label>تأخير الإخفاء ( ms )</label><input type="range" id="rgDelay" min="200" max="2000" step="100" /></div>
      <div class="row"><label>الشاشة</label><select id="selMonitor"></select></div>
      <button class="mbtn" id="mReset">استعادة الموضع الافتراضي</button>
      <button class="mbtn" id="mSettings">إعدادات VEXORA كاملة</button>
      <button class="mbtn warn" id="mHide">إخفاء الفقاعة</button>
    </div>
    <div id="toast"></div>
  </div>

  <script>
    const TAURI = window.__TAURI__ || {};
    const core = TAURI.core || {};
    const events = TAURI.event || {};
    const win = TAURI.window ? TAURI.window.getCurrentWindow() : null;
    const invoke = (cmd, args = {}) => core.invoke ? core.invoke(cmd, args) : Promise.resolve(null);
    const $ = (id) => document.getElementById(id);

    const FULL_W = () => 400 * (state.scale || 1);
    const FULL_H = () => 96 * (state.scale || 1);
    const TAB_W = () => 30 * (state.scale || 1);
    const TAB_H = () => 128 * (state.scale || 1);

    const state = {
      settings: null, monitors: [], side: "none", work: null,
      collapsed: false, pinnedUntil: 0, visible: true, animating: false, dragging: false,
      timers: [], poll: null, scale: 1, moveTimer: null, suppressMoved: false,
    };

    function later(fn, ms) { const id = setTimeout(fn, ms); state.timers.push(id); return id; }
    function clearTimers() { state.timers.forEach(clearTimeout); state.timers = []; }

    // In-app status instead of native alert()/confirm(), which freeze the
    // WebView and leave the bubble stuck until the user presses Escape.
    function showToast(msg, isError) {
      const el = $("toast");
      if (!el) return;
      el.textContent = String(msg || "");
      el.classList.toggle("err", !!isError);
      el.classList.add("show");
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => el.classList.remove("show"), 3600);
    }

    async function loadSettings() {
      try {
        state.settings = await invoke("get_settings") || {};
      } catch (e) { state.settings = {}; }
      state.scale = Math.min(1.5, Math.max(0.8, Number(state.settings.widgetScale) || 1));
      $("app").style.setProperty("--op", String(Math.min(1, Math.max(0.4, Number(state.settings.widgetOpacity) || 0.96))));
    }

    async function persist(patch) {
      const next = { ...state.settings, ...patch };
      state.settings = next;
      try { await invoke("save_settings", { settings: next }); } catch (e) {}
      state.scale = Math.min(1.5, Math.max(0.8, Number(next.widgetScale) || 1));
      $("app").style.setProperty("--op", String(Math.min(1, Math.max(0.4, Number(next.widgetOpacity) || 0.96))));
    }

    const fmtSpeed = (b) => {
      if (!isFinite(b) || b <= 0) return "0 B/s";
      if (b < 1024) return b.toFixed(0) + " B/s";
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB/s";
      return (b / 1048576).toFixed(2) + " MB/s";
    };

    async function refresh() {
      try {
        const s = await invoke("widget_stats");
        const cpu = Math.round(s.cpu || 0), mem = Math.round(s.memPct || 0);
        $("cpuTxt").textContent = cpu + "%";
        $("ramTxt").textContent = mem + "%";
        $("cpuBar").style.width = cpu + "%";
        $("ramBar").style.width = mem + "%";
        $("upTxt").textContent = fmtSpeed(s.netUp);
        $("downTxt").textContent = fmtSpeed(s.netDown);
      } catch (e) {}
    }

    function startPolling() {
      if (state.poll) clearInterval(state.poll);
      const ms = Math.max(1000, Number(state.settings.widgetRefreshMs) || 1500);
      state.poll = setInterval(() => {
        if (state.visible && !document.hidden) refresh();
      }, ms);
      refresh();
    }

    // ---- monitors & geometry -------------------------------------------------
    async function loadMonitors() {
      try { state.monitors = await invoke("widget_monitors") || []; }
      catch (e) { state.monitors = []; }
      const sel = $("selMonitor");
      const current = String(state.settings.widgetMonitor ?? -1);
      sel.innerHTML = '<option value="-1">تلقائي</option>' +
        state.monitors.map((m, i) => `<option value="${i}">${String(m.name || ("شاشة " + (i + 1))).replace(/[<>]/g, "")} ${m.primary ? "(رئيسية)" : ""}</option>`).join("");
      sel.value = state.monitors[current] ? current : "-1";
    }

    function activeMonitor(pos) {
      if (!state.monitors.length) return null;
      const chosen = Number(state.settings.widgetMonitor);
      if (chosen >= 0 && state.monitors[chosen]) return state.monitors[chosen];
      const cx = pos.x + FULL_W() / 2, cy = pos.y + FULL_H() / 2;
      const inside = state.monitors.find(m => cx >= m.left && cx <= m.right && cy >= m.top && cy <= m.bottom);
      if (inside) return inside;
      return state.monitors.reduce((best, m) => {
        const d = Math.hypot((m.left + m.right) / 2 - cx, (m.top + m.bottom) / 2 - cy);
        return (!best || d < best.d) ? { m, d } : best;
      }, null)?.m || state.monitors[0];
    }

    function snapX(left, width, workLeft, workRight, distance) {
      const d = Math.max(0, distance | 0);
      if (left <= workLeft + d) return workLeft;
      if (workRight - (left + width) <= d) return workRight - width;
      return null;
    }
    function clampY(y, height, top, bottom, margin = 8) {
      const min = top + margin, max = Math.max(min, bottom - margin - height);
      return Math.max(min, Math.min(max, y));
    }

    async function animateTo(x, y) {
      if (!win) return;
      state.suppressMoved = true;
      const release = () => setTimeout(() => { state.suppressMoved = false; }, 400);
      const from = await win.outerPosition();
      const dx = x - from.x, dy = y - from.y;
      if (Math.abs(dx) < 2 && Math.abs(dy) < 2) { await win.setPosition(x, y); release(); return; }
      state.animating = true;
      for (let i = 1; i <= 8; i++) {
        await win.setPosition(Math.round(from.x + dx * i / 8), Math.round(from.y + dy * i / 8));
        await new Promise(r => setTimeout(r, 14));
      }
      state.animating = false;
      release();
    }

    async function finalizeDrag() {
      if (!win || state.animating) return;
      await new Promise(r => setTimeout(r, 130));
      const pos = await win.outerPosition();
      const size = await win.outerSize();
      const mon = activeMonitor(pos);
      if (!mon) return;
      state.work = mon;
      let x = pos.x, y = pos.y;
      let side = "none";
      if (state.settings.widgetSnap) {
        const sx = snapX(x, size.width, mon.workLeft, mon.workRight, Number(state.settings.widgetSnapDistance) || 28);
        if (sx !== null) { x = sx; side = (x <= (mon.workLeft + mon.workRight) / 2) ? "left" : "right"; }
      }
      y = clampY(y, size.height, mon.workTop, mon.workBottom, 8);
      state.side = side;
      await animateTo(x, y);
      try { await invoke("widget_save_bounds", { x, y, side }); } catch (e) {}
      if (side !== "none" && state.settings.widgetAutoHide) scheduleCollapse();
    }

    // ---- auto hide (driven by the Rust watcher) ------------------------------
    async function collapse() {
      // Rust watcher owns resize/move and emits `widget-collapse-state`.
    }
    async function expand() {
      await invoke("widget_pin");
    }
    function scheduleCollapse() {
      // Handled in Rust using real cursor tracking and a debounce.
    }

    document.addEventListener("click", (e) => {
      if (state.side !== "none") expand(); // temporary pin on the edge tab
      const menu = $("menu");
      if (!menu.contains(e.target) && !e.target.closest("#dots")) menu.classList.remove("show");
    });

    // ---- wiring --------------------------------------------------------------
    $("handle").addEventListener("mousedown", async (e) => {
      if (e.button !== 0 || e.target.closest("#dots")) return;
      clearTimers();
      state.dragging = true;
      state.pinnedUntil = Date.now() + 8000;
      await invoke("widget_pin");
      if (state.collapsed) await expand();
      try { await win.startDragging(); } catch (err) {}
    });
    document.addEventListener("mouseup", () => {
      if (!state.dragging || !win) return;
      clearTimeout(state.moveTimer);
      state.moveTimer = setTimeout(() => { state.dragging = false; finalizeDrag(); }, 180);
    });

    $("dots").addEventListener("click", (e) => {
      e.stopPropagation();
      $("menu").classList.toggle("show");
    });
    let cleanArmed = 0;
    $("btnClean").onclick = async () => {
      const ar = !(state.settings && state.settings.language === "en");
      const now = Date.now();
      if (now - cleanArmed > 4000) {
        cleanArmed = now;
        showToast(ar ? "اضغط مرة أخرى للتأكيد" : "Click again to confirm");
        return;
      }
      cleanArmed = 0;
      $("btnClean").disabled = true;
      showToast(ar ? "جارٍ التنظيف…" : "Cleaning…");
      try {
        const res = await invoke("clean_cleaners", { ids: ["system.user_temp", "system.windows_temp", "advanced.all_user_temp", "advanced.public_temp"] });
        const mb = ((res && res.freed) || 0) / 1048576;
        showToast((ar ? "تم تحرير " : "Freed ") + mb.toFixed(1) + " MB");
      } catch (e) {
        showToast((ar ? "خطأ: " : "Error: ") + (e && e.message ? e.message : e), true);
      } finally {
        $("btnClean").disabled = false;
      }
    };
    $("btnBoost").onclick = async () => {
      const ar = !(state.settings && state.settings.language === "en");
      try { await invoke("free_memory"); showToast(ar ? "تم تحرير الذاكرة" : "Memory freed"); }
      catch (e) { showToast((ar ? "خطأ: " : "Error: ") + (e && e.message ? e.message : e), true); }
    };
    $("btnProc").onclick = () => invoke("widget_open_page", { page: "bgprograms" });
    $("mReset").onclick = async () => {
      try { await invoke("widget_reset_position"); } catch (e) {}
      state.side = "none";
      if (win) { await win.setPosition(120, 120); }
    };
    $("mSettings").onclick = () => invoke("widget_open_page", { page: "settings" });
    $("mHide").onclick = () => invoke("widget_hide");

    function bindSwitch(id, key, extra) {
      const el = $(id);
      el.classList.toggle("on", !!state.settings[key]);
      el.onclick = async () => {
        const next = !el.classList.contains("on");
        el.classList.toggle("on", next);
        await persist({ [key]: next });
        if (extra) await extra(next);
      };
    }
    function bindRange(id, key, mult = 1) {
      const el = $(id);
      el.value = String(Math.round((Number(state.settings[key]) || 0) * mult));
      el.onchange = async () => {
        const val = Number(el.value) / mult;
        const patch = { [key]: val };
        if (key === "widgetOpacity") patch.widgetOpacity = Math.min(1, Math.max(.4, val));
        await persist(patch);
        if (key === "widgetScale") await win.setSize(FULL_W(), FULL_H());
      };
    }

    async function init() {
      await loadSettings();
      await loadMonitors();
      state.side = state.settings.widgetSide || "none";
      if (win) {
        const pos = await win.outerPosition();
        state.work = activeMonitor(pos);
      }
      bindSwitch("swAutoHide", "widgetAutoHide");
      bindSwitch("swTop", "widgetAlwaysOnTop", async (on) => invoke("widget_set_always_on_top", { on }));
      bindSwitch("swSnap", "widgetSnap");
      bindSwitch("swRunWin", "widgetRunWithWindows", async (on) => {
        try { await invoke("widget_set_run_at_startup", { enable: on }); } catch (e) {}
      });
      bindRange("rgOpacity", "widgetOpacity", 100);
      bindRange("rgScale", "widgetScale", 100);
      bindRange("rgSnapDist", "widgetSnapDistance");
      bindRange("rgDelay", "widgetHideDelayMs");
      const ref = $("selRefresh");
      ref.value = String(state.settings.widgetRefreshMs || 1500);
      ref.onchange = () => persist({ widgetRefreshMs: Number(ref.value) }).then(startPolling);
      $("selMonitor").onchange = (e) => persist({ widgetMonitor: Number(e.target.value) });

      if (events.listen) {
        events.listen("widget-visibility", (ev) => {
          state.visible = !!ev.payload;
          if (state.visible) { refresh(); if (state.side !== "none" && state.settings.widgetAutoHide) scheduleCollapse(); }
          else clearTimers();
        });
        events.listen("widget-collapse-state", (ev) => {
          state.collapsed = !!ev.payload;
          document.body.classList.toggle("collapsed", state.collapsed);
        });
        events.listen("widget-snapped", (ev) => {
          const p = ev.payload || {};
          state.side = p.side || "none";
          if (p.workLeft !== undefined) {
            state.work = {
              name: "", primary: true,
              left: p.workLeft, top: p.workTop, right: p.workRight, bottom: p.workBottom,
              workLeft: p.workLeft, workTop: p.workTop,
              workRight: p.workRight, workBottom: p.workBottom,
            };
          }
          clearTimers();
          if (state.side !== "none" && state.settings.widgetAutoHide) scheduleCollapse();
        });
      }
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refresh();
      });
      startPolling();
      if (state.side !== "none" && state.settings.widgetAutoHide) scheduleCollapse();
    }
    init();
  </script>
</body>
</html>
