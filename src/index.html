<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEXORA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="" />
        <div class="brand-text">
          <strong data-i18n="app.title">VEXORA</strong>
          <span data-i18n="app.tagline">Clean Smarter. Run Faster.</span>
        </div>
      </div>

      <nav id="nav" class="nav"></nav>

      <div class="sidebar-footer">
        <div id="adminBadge" class="badge-admin hidden"></div>
        <button id="appearanceBtn" class="icon-btn" title="appearance" aria-label="Appearance Studio">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="16" cy="11" r="1"/><path d="M12 21c3-3 5-5 5-8a5 5 0 0 0-10 0c0 3 2 5 5 8Z"/></svg>
        </button>
        <button id="themeBtn" class="icon-btn" title="theme"></button>
        <button id="langBtn" class="icon-btn" title="language"></button>
        <button id="updateBtn" class="icon-btn" title="التحديثات"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg></button>
      </div>
      <div class="sidebar-credit">
        <button id="vexMyStyle" class="vex-my-style" title="My Style">
          <span id="vexMyStyleDot" class="vex-my-dot"></span>
          <span id="vexMyStyleLabel">Grid · Cyan</span>
        </button>
        <span class="vex-version-row"><span id="appVersion"></span>
          <button id="vexVersionUpdate" class="vex-version-update" title="Check for updates" aria-label="Check for updates">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/><path d="M12 8v4l3 2"/></svg>
          </button>
        </span><br />
        <strong data-i18n="creditShort">أ. رمضان فاضل مصطفى (أبو مريم)</strong>
      </div>
    </aside>

    <main class="main">
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="modalRoot" class="modal-root hidden">
    <div class="modal-backdrop"></div>
    <div class="modal" role="dialog">
      <header class="modal-head">
        <h3 id="modalTitle"></h3>
        <button id="modalClose" class="icon-btn">✕</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
      <footer id="modalFoot" class="modal-foot"></footer>
    </div>
  </div>

  <button id="vexUpdateDock" class="vex-update-dock" title="Check for updates" aria-label="Check for updates">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/><path d="M12 8v4l3 2"/></svg>
  </button>

  <div id="toasts" class="toasts"></div>
  <div id="busy" class="busy hidden"><div class="spinner"></div><span id="busyText"></span></div>

  <script src="app.js" charset="utf-8"></script>
</body>
</html>
